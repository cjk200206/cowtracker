data:
  data_root: data/event_kubric
  split: test
  seq_len: 24
  traj_per_sample: 256
  crop_size: [384, 512]
  frame_source: blur
  use_augs: false
  random_temporal_crop: true
  choose_long_point: false

model:
  features: 128
  side_resnet_channels: 128
  down_ratio: 2
  warp_iters: 5
  warp_vit_num_blocks: null
  freeze_aggregator: true
  freeze_feature_extractor: false
  freeze_tracking_head: false

train:
  save_dir: output/train_rgb_tapformer_test
  batch_size: 1
  num_workers: 4
  shuffle: true
  pin_memory: true
  drop_last: true
  epochs: 40
  max_steps: null
  lr: 0.0005
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  precision: bf16
  seed: 0
  log_every: 10
  save_every_steps: 1000
  save_best: true
  save_last: true
  best_metric: loss
  best_mode: min
  init_checkpoint: null
  init_from_hf: true
  init_strict: false
  resume: null

loss:
  coord_weight: 0.05
  visibility_weight: 1.0
  confidence_weight: 1.0
  confidence_threshold: 12.0
  use_huber: true
  huber_delta: 6.0
